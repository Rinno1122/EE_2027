    <text x="190" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="800" fill="#CCFBF1">ELECTRIFIED PROCESS &amp; CHP</text>
    <rect x="46" y="88" width="288" height="96" rx="48" fill="#071930" stroke="#93C5FD" stroke-width="2.4"/>
    <line x1="94" y1="88" x2="94" y2="184" stroke="#64748B" stroke-width="3"/>
    <line x1="286" y1="88" x2="286" y2="184" stroke="#64748B" stroke-width="3"/>
    <line x1="94" y1="112" x2="286" y2="112" stroke="#F97316" stroke-width="4.5"/>
    <line x1="94" y1="136" x2="286" y2="136" stroke="#F59E0B" stroke-width="4.5"/>
    <line x1="94" y1="160" x2="286" y2="160" stroke="#2DD4BF" stroke-width="4.5"/>
    <line x1="154" y1="90" x2="154" y2="154" stroke="#94A3B8" stroke-width="2"/>
    <line x1="224" y1="118" x2="224" y2="182" stroke="#94A3B8" stroke-width="2"/>
    <g transform="translate(66,218)">
