<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Topic 06: Process Industry Decarbonization">

  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071930"/>
      <stop offset="55%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#133763"/>
    </linearGradient>
    <pattern id="gridPat" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93C5FD" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="#0B2545"/>
  <rect width="960" height="540" fill="url(#bgSky)"/>
  <rect width="960" height="540" fill="url(#gridPat)"/>

  <g transform="translate(75,92)">
    <rect x="0" y="0" width="380" height="320" rx="22" fill="#0E2C52" stroke="#F59E0B" stroke-opacity="0.75" stroke-width="2.2"/>
    <text x="190" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="800" fill="#FEF3C7">PINCH ANALYSIS (T–H CURVES)</text>
    <line x1="52" y1="268" x2="345" y2="268" stroke="#94A3B8" stroke-width="2"/>
    <line x1="52" y1="268" x2="52" y2="62" stroke="#94A3B8" stroke-width="2"/>
    <text x="340" y="290" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#CBD5E1">Enthalpy ΔH</text>
    <text x="42" y="72" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#CBD5E1">T</text>
    <!-- Hot Composite Curve (Solid Vivid Orange-Red) -->
    <path d="M72 225 L185 156 L328 82" fill="none" stroke="#F97316" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="275" y="92" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#FDBA74">Hot Curve</text>
    <!-- Cold Composite Curve (Solid Vivid Sky Blue) -->
    <path d="M98 252 L185 196 L338 134" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="278" y="170" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#7DD3FC">Cold Curve</text>
    <!-- Pinch Point Marker -->
    <line x1="185" y1="156" x2="185" y2="196" stroke="#FDE047" stroke-width="3" stroke-dasharray="4 3"/>
    <circle cx="185" cy="176" r="20" fill="#F59E0B" fill-opacity="0.28" stroke="#FDE047" stroke-width="2.2"/>
    <text x="216" y="236" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#FDE047">ΔT min (Pinch)</text>
  </g>

  <g transform="translate(505,92)">
