      <text x="56" y="28" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#FDE047">E-HEAT</text>
      <text x="56" y="47" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10.5" fill="#E2E8F0">Process Steam</text>
    </g>
    <g transform="translate(202,218)">
      <rect x="0" y="0" width="112" height="62" rx="14" fill="#0B2545" stroke="#2DD4BF" stroke-width="2"/>
      <text x="56" y="28" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#5EEAD4">CHP</text>
      <text x="56" y="47" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10.5" fill="#E2E8F0">Cogeneration</text>
    </g>
  </g>

  <g transform="translate(90,466)">
    <rect x="0" y="0" width="215" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#F59E0B" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#F59E0B"/>
    <text x="113.5" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">PINCH &amp; HEAT TRANSFER</text>
  </g>
  <g transform="translate(372,466)">
    <rect x="0" y="0" width="215" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#38BDF8"/>
    <text x="113.5" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">PROCESS ELECTRIFICATION</text>
  </g>
  <g transform="translate(655,466)">
    <rect x="0" y="0" width="215" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#2DD4BF" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#2DD4BF"/>
    <text x="113.5" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">STEAM &amp; COGENERATION</text>
  </g>
  <g transform="translate(32,26)">
    <rect x="0" y="0" width="54" height="30" rx="15" fill="#F59E0B" fill-opacity="0.22" stroke="#FDE68A" stroke-opacity="0.75" stroke-width="1.4"/>
    <text x="27" y="20" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#FEF3C7">06</text>
  </g>
