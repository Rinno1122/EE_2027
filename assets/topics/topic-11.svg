<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Topic: Smart Grids &amp; Virtual Power Plants">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071930"/>
      <stop offset="55%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#133763"/>
    </linearGradient>
    <pattern id="gridPat" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93C5FD" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="#0B2545"/>
  <rect width="960" height="540" fill="url(#bgSky)"/>
  <rect width="960" height="540" fill="url(#gridPat)"/>

  <!-- Soft Ambient Glow Behind VPP Core -->
  <circle cx="480" cy="238" r="185" fill="#14B8A6" fill-opacity="0.08"/>
  <circle cx="480" cy="238" r="130" fill="#F59E0B" fill-opacity="0.07"/>

  <!-- Bidirectional Power & Telemetry Links from Center VPP Hub to 4 Distributed Energy Resource Nodes -->
  <g fill="none" stroke-width="3.2" stroke-dasharray="9 6">
    <path d="M372 190 L260 142" stroke="#F59E0B"/>
    <path d="M588 190 L700 142" stroke="#38BDF8"/>
    <path d="M372 286 L260 338" stroke="#2DD4BF"/>
    <path d="M588 286 L700 338" stroke="#FDE047"/>
  </g>
  <!-- Energy flow nodes -->
  <circle cx="316" cy="166" r="5" fill="#FDE047"/>
  <circle cx="644" cy="166" r="5" fill="#7DD3FC"/>
  <circle cx="316" cy="312" r="5" fill="#5EEAD4"/>
  <circle cx="644" cy="312" r="5" fill="#FDE047"/>

  <!-- Top-Left Node: Distributed Solar PV & Wind -->
  <g transform="translate(68,86)">
    <rect x="0" y="0" width="194" height="110" rx="18" fill="#0E2C52" stroke="#F59E0B" stroke-width="2.2"/>
    <text x="97" y="30" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#FEF3C7">DER • SOLAR &amp; WIND</text>
    <!-- Mini PV + Turbine -->
    <polygon points="36,84 52,50 108,50 92,84" fill="#0369A1" stroke="#7DD3FC" stroke-width="1.6"/>
    <line x1="64" y1="50" x2="48" y2="84" stroke="#7DD3FC" stroke-width="1"/>
    <line x1="86" y1="50" x2="70" y2="84" stroke="#7DD3FC" stroke-width="1"/>
    <line x1="146" y1="88" x2="146" y2="54" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M146 54 L142 36 L149 38 Z" fill="#F8FAFC"/>
    <path d="M146 54 L162 64 L158 68 Z" fill="#CBD5E1"/>
    <path d="M146 54 L130 64 L134 68 Z" fill="#CBD5E1"/>
    <circle cx="146" cy="54" r="3.5" fill="#F59E0B"/>
  </g>

  <!-- Top-Right Node: Grid-Scale BESS Storage -->
  <g transform="translate(698,86)">
    <rect x="0" y="0" width="194" height="110" rx="18" fill="#0E2C52" stroke="#38BDF8" stroke-width="2.2"/>
    <text x="97" y="30" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#7DD3FC">BESS FLEXIBILITY</text>
    <rect x="34" y="46" width="26" height="44" rx="4" fill="#071930" stroke="#5EEAD4" stroke-width="1.5"/>
    <rect x="38" y="60" width="18" height="26" rx="2" fill="#2DD4BF"/>
    <rect x="68" y="46" width="26" height="44" rx="4" fill="#071930" stroke="#5EEAD4" stroke-width="1.5"/>
    <rect x="72" y="54" width="18" height="32" rx="2" fill="#38BDF8"/>
    <rect x="102" y="46" width="26" height="44" rx="4" fill="#071930" stroke="#FDE047" stroke-width="1.5"/>
    <rect x="106" y="51" width="18" height="35" rx="2" fill="#F59E0B"/>
    <path d="M154 50 L144 68 L153 68 L148 86 L165 64 L155 64 Z" fill="#FDE047"/>
  </g>

  <!-- Bottom-Left Node: Prosumer Buildings & Smart Meters -->
  <g transform="translate(68,286)">
    <rect x="0" y="0" width="194" height="110" rx="18" fill="#0E2C52" stroke="#2DD4BF" stroke-width="2.2"/>
    <text x="97" y="30" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#5EEAD4">SMART PROSUMERS</text>
    <rect x="34" y="48" width="42" height="44" rx="4" fill="#133763" stroke="#7DD3FC" stroke-width="1.6"/>
    <rect x="86" y="40" width="46" height="52" rx="4" fill="#133763" stroke="#2DD4BF" stroke-width="1.6"/>
    <rect x="142" y="56" width="22" height="36" rx="4" fill="#071930" stroke="#F59E0B" stroke-width="1.6"/>
    <rect x="44" y="58" width="10" height="10" fill="#FDE047" fill-opacity="0.75"/>
    <rect x="96" y="50" width="10" height="10" fill="#FDE047" fill-opacity="0.75"/>
    <rect x="112" y="50" width="10" height="10" fill="#2DD4BF" fill-opacity="0.8"/>
    <text x="153" y="78" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="800" fill="#FEF08A">IoT</text>
  </g>

  <!-- Bottom-Right Node: EV Fleets & Demand Response -->
  <g transform="translate(698,286)">
    <rect x="0" y="0" width="194" height="110" rx="18" fill="#0E2C52" stroke="#FDE047" stroke-width="2.2"/>
    <text x="97" y="30" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#FEF08A">V2G &amp; DEMAND RESP.</text>
    <polyline points="26,76 52,76 66,52 84,88 102,46 122,74 146,60 168,66" fill="none" stroke="#2DD4BF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Center Hub: Virtual Power Plant (VPP) Cloud & Smart Grid Control -->
  <g transform="translate(480,238)">
    <circle r="118" fill="#071930" stroke="#2DD4BF" stroke-width="3.4"/>
    <circle r="102" fill="none" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="10 6"/>
    <!-- Grid frequency sine wave inside core -->
    <path d="M-74 18 Q-55 -16 -36 18 T0 18 T36 18 T74 18" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="-32" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">VPP</text>
    <text x="0" y="-10" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="800" fill="#FDE047">VIRTUAL POWER PLANT</text>
    <text x="0" y="54" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#5EEAD4">50.00 Hz • Smart Grid</text>
    <text x="0" y="72" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10.5" fill="#CBD5E1">Aggregator &amp; Dispatch</text>
  </g>

  <!-- Bottom Feature Pills -->
  <g transform="translate(82,468)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#F59E0B" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#F59E0B"/>
    <text x="116" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">SMART GRIDS &amp; DSO</text>
  </g>
  <g transform="translate(370,468)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#2DD4BF" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#2DD4BF"/>
    <text x="116" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">VIRTUAL POWER PLANTS</text>
  </g>
  <g transform="translate(658,468)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#38BDF8"/>
    <text x="116" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">GRID FLEXIBILITY &amp; DR</text>
  </g>

  <!-- Corner Yellow Diamond Badge -->
  <g transform="translate(32,26)">
    <rect x="0" y="0" width="38" height="30" rx="15" fill="#F59E0B" fill-opacity="0.22" stroke="#FDE68A" stroke-opacity="0.75" stroke-width="1.4"/>
    <polygon points="19,8 26,15 19,22 12,15" fill="#FDE047"/>
  </g>
</svg>
