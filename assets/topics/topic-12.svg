<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Topic: Heat Transfer &amp; CFD">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071930"/>
      <stop offset="55%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#133763"/>
    </linearGradient>
    <pattern id="gridPat" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93C5FD" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="#0B2545"/>
  <rect width="960" height="540" fill="url(#bgSky)"/>
  <rect width="960" height="540" fill="url(#gridPat)"/>

  <!-- Left Panel: Thermal Boundary Layer & Fin-and-Tube Heat Transfer -->
  <g transform="translate(66,92)">
    <rect x="0" y="0" width="330" height="322" rx="22" fill="#0E2C52" stroke="#F97316" stroke-width="2.2"/>
    <text x="165" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="800" fill="#FED7AA">HEAT &amp; MASS TRANSFER</text>

    <!-- Hot Wall + Thermal Boundary Layer Bands -->
    <rect x="34" y="64" width="22" height="196" rx="6" fill="#EF4444" stroke="#FCA5A5" stroke-width="1.6"/>
    <rect x="56" y="64" width="24" height="196" fill="#F97316" fill-opacity="0.55"/>
    <rect x="80" y="64" width="28" height="196" fill="#F59E0B" fill-opacity="0.38"/>
    <rect x="108" y="64" width="34" height="196" fill="#2DD4BF" fill-opacity="0.25"/>
    <rect x="142" y="64" width="44" height="196" fill="#38BDF8" fill-opacity="0.16"/>

    <!-- Exponential Temperature Profile T(x) -->
    <path d="M56 76 C74 148 112 204 282 238" fill="none" stroke="#FEF08A" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="56" cy="76" r="5" fill="#FEF08A"/>
    <circle cx="282" cy="238" r="5" fill="#7DD3FC"/>

    <!-- Heat Flux Arrows q'' -->
    <path d="M72 118 L128 118" stroke="#FDE047" stroke-width="2.6" stroke-linecap="round"/>
    <polygon points="136,118 124,112 124,124" fill="#FDE047"/>
    <path d="M72 164 L148 164" stroke="#FDE047" stroke-width="2.6" stroke-linecap="round"/>
    <polygon points="156,164 144,158 144,170" fill="#FDE047"/>
    <text x="195" y="122" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#FEF08A">q&quot; = −k ∇T</text>
    <text x="195" y="144" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#5EEAD4">Nu • Re • Pr</text>
    <text x="235" y="218" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#CBD5E1">T(x) Profile</text>

    <text x="165" y="294" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#CBD5E1">Conduction • Convection • Phase Change</text>
  </g>

  <!-- Right Panel: CFD Streamlines & Heated Cylinder / Tube-Bank Wake -->
  <g transform="translate(432,92)">
    <rect x="0" y="0" width="462" height="322" rx="22" fill="#071930" stroke="#38BDF8" stroke-width="2.2"/>
    <text x="231" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="800" fill="#7DD3FC">CFD FLOW &amp; THERMAL WAKE</text>

    <!-- Subtle Computational Mesh Grid Lines inside CFD Domain -->
    <g stroke="#38BDF8" stroke-opacity="0.14" stroke-width="1">
      <line x1="34" y1="62" x2="428" y2="62"/>
      <line x1="34" y1="104" x2="428" y2="104"/>
      <line x1="34" y1="146" x2="428" y2="146"/>
      <line x1="34" y1="188" x2="428" y2="188"/>
      <line x1="34" y1="230" x2="428" y2="230"/>
      <line x1="34" y1="272" x2="428" y2="272"/>
      <line x1="100" y1="62" x2="100" y2="272"/>
      <line x1="166" y1="62" x2="166" y2="272"/>
      <line x1="232" y1="62" x2="232" y2="272"/>
      <line x1="298" y1="62" x2="298" y2="272"/>
      <line x1="364" y1="62" x2="364" y2="272"/>
    </g>

    <!-- CFD Streamlines deflecting cleanly around heated tube -->
    <path d="M36 92 C110 92 145 78 190 78 C245 78 295 102 426 88" fill="none" stroke="#38BDF8" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M36 126 C105 126 142 104 190 104 C248 104 290 138 355 122 C386 114 405 124 426 120" fill="none" stroke="#2DD4BF" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M36 168 L142 168" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <!-- Vortex shedding thermal wake behind tube -->
    <path d="M236 168 C268 140 296 196 334 156 C366 122 396 198 426 164" fill="none" stroke="#EF4444" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M236 174 C268 202 298 146 336 184 C368 214 396 144 426 178" fill="none" stroke="#F97316" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M36 210 C105 210 142 232 190 232 C248 232 292 204 356 220 C386 226 406 214 426 218" fill="none" stroke="#2DD4BF" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M36 244 C110 244 145 258 190 258 C245 258 295 236 426 248" fill="none" stroke="#38BDF8" stroke-width="3.6" stroke-linecap="round"/>

    <!-- Heated Tube / Cylinder with Thermal Halo -->
    <circle cx="190" cy="168" r="46" fill="#F97316" fill-opacity="0.22"/>
    <circle cx="190" cy="168" r="32" fill="#0B2545" stroke="#FDE047" stroke-width="3"/>
    <text x="190" y="165" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="800" fill="#FEF08A">T_wall</text>
    <text x="190" y="180" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#FDBA74">CFD</text>

    <text x="231" y="294" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#CBD5E1">Turbulence • Multiphase • Conjugate Heat Transfer</text>
  </g>

  <!-- Connector Arrow -->
  <path d="M396 253 L432 253" stroke="#FDE047" stroke-width="3.5" stroke-dasharray="6 4"/>

  <!-- Bottom Feature Pills -->
  <g transform="translate(82,468)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#F97316" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#F97316"/>
    <text x="116" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">HEAT &amp; MASS TRANSFER</text>
  </g>
  <g transform="translate(370,468)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#38BDF8"/>
    <text x="116" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">CFD &amp; TURBULENCE</text>
  </g>
  <g transform="translate(658,468)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#2DD4BF" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#2DD4BF"/>
    <text x="116" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">HEAT EXCHANGERS</text>
  </g>

  <!-- Corner Yellow Diamond Badge -->
  <g transform="translate(32,26)">
    <rect x="0" y="0" width="38" height="30" rx="15" fill="#F59E0B" fill-opacity="0.22" stroke="#FDE68A" stroke-opacity="0.75" stroke-width="1.4"/>
    <polygon points="19,8 26,15 19,22 12,15" fill="#FDE047"/>
  </g>
</svg>
