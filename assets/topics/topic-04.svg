<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Topic 04: Hydrogen &amp; Energy Storage">

  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071930"/>
      <stop offset="55%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#133763"/>
    </linearGradient>
    <pattern id="gridPat" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93C5FD" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="#0B2545"/>
  <rect width="960" height="540" fill="url(#bgSky)"/>
  <rect width="960" height="540" fill="url(#gridPat)"/>

  <circle cx="480" cy="240" r="175" fill="#14B8A6" fill-opacity="0.08"/>
  <!-- Card 1: BESS Electrochemical Battery Storage -->
  <g transform="translate(72,115)">
    <rect x="0" y="0" width="245" height="275" rx="22" fill="#0E2C52" stroke="#2DD4BF" stroke-width="2.2"/>
    <text x="122" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#5EEAD4">BESS BATTERIES</text>
    <rect x="44" y="64" width="44" height="145" rx="8" fill="#071930" stroke="#5EEAD4" stroke-width="1.8"/>
    <rect x="51" y="100" width="30" height="102" rx="4" fill="#2DD4BF"/>
    <rect x="100" y="64" width="44" height="145" rx="8" fill="#071930" stroke="#5EEAD4" stroke-width="1.8"/>
    <rect x="107" y="84" width="30" height="118" rx="4" fill="#38BDF8"/>
    <rect x="156" y="64" width="44" height="145" rx="8" fill="#071930" stroke="#FDE047" stroke-width="1.8"/>
    <rect x="163" y="74" width="30" height="128" rx="4" fill="#F59E0B"/>
    <text x="122" y="244" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#CBD5E1">Grid-Scale &amp; Peak Shaving</text>
  </g>

  <!-- Card 2: Hydrogen & Seasonal Chemical Storage -->
  <g transform="translate(358,115)">
    <rect x="0" y="0" width="245" height="275" rx="22" fill="#071930" stroke="#38BDF8" stroke-width="2.4"/>
    <text x="122" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#7DD3FC">HYDROGEN &amp; E-FUELS</text>
    <circle cx="122" cy="140" r="66" fill="#0E2C52" stroke="#38BDF8" stroke-width="2.6"/>
    <line x1="94" y1="136" x2="150" y2="136" stroke="#FEF08A" stroke-width="5"/>
    <circle cx="92" cy="136" r="24" fill="#14B8A6" stroke="#CCFBF1" stroke-width="2"/>
    <circle cx="152" cy="136" r="24" fill="#0EA5E9" stroke="#E0F2FE" stroke-width="2"/>
    <text x="92" y="143" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="800" fill="#071930">H</text>
    <text x="152" y="143" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="800" fill="#071930">H</text>
    <text x="122" y="244" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#CBD5E1">Electrolysis &amp; Seasonal H₂</text>
  </g>

  <!-- Card 3: Thermal & Latent PCM Storage -->
  <g transform="translate(644,115)">
    <rect x="0" y="0" width="245" height="275" rx="22" fill="#0E2C52" stroke="#F59E0B" stroke-width="2.2"/>
    <text x="122" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#FEF3C7">THERMAL / PCM TES</text>
    <!-- Stratified Thermal Tank -->
    <rect x="52" y="62" width="140" height="150" rx="26" fill="#071930" stroke="#F59E0B" stroke-width="2.2"/>
    <rect x="60" y="72" width="124" height="36" rx="14" fill="#EF4444" fill-opacity="0.85"/>
    <rect x="60" y="114" width="124" height="36" rx="8" fill="#F59E0B" fill-opacity="0.85"/>
    <rect x="60" y="156" width="124" height="44" rx="14" fill="#0284C7" fill-opacity="0.85"/>
    <text x="122" y="95" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">HOT / PCM</text>
    <text x="122" y="182" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#E0F2FE">COLD LAYER</text>
    <text x="122" y="244" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#CBD5E1">Sensible &amp; Latent Storage</text>
  </g>

  <path d="M317 252 L358 252 M603 252 L644 252" stroke="#FDE047" stroke-width="3.5" stroke-dasharray="6 4"/>

  <g transform="translate(85,466)">
    <rect x="0" y="0" width="210" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#2DD4BF" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#2DD4BF"/>
    <text x="111.0" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">BATTERY BESS SYSTEMS</text>
  </g>
  <g transform="translate(375,466)">
    <rect x="0" y="0" width="210" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#38BDF8"/>
    <text x="111.0" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">GREEN H₂ &amp; POWER-TO-X</text>
  </g>
  <g transform="translate(665,466)">
    <rect x="0" y="0" width="210" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#F59E0B" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#F59E0B"/>
    <text x="111.0" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">THERMAL &amp; PCM TANKS</text>
  </g>
  <g transform="translate(32,26)">
    <rect x="0" y="0" width="38" height="30" rx="15" fill="#F59E0B" fill-opacity="0.22" stroke="#FDE68A" stroke-opacity="0.75" stroke-width="1.4"/>
    <polygon points="19,8 26,15 19,22 12,15" fill="#FDE047"/>
  </g>
</svg>
