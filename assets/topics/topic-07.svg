<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Topic 07: Sustainable Construction">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071930"/>
      <stop offset="55%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#133763"/>
    </linearGradient>
    <pattern id="gridPat" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93C5FD" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="#0B2545"/>
  <rect width="960" height="540" fill="url(#bgSky)"/>
  <rect width="960" height="540" fill="url(#gridPat)"/>

  <!-- Solar Glow -->
  <circle cx="805" cy="96" r="96" fill="#F59E0B" fill-opacity="0.08"/>
  <circle cx="805" cy="96" r="64" fill="#F59E0B" fill-opacity="0.16"/>
  <circle cx="805" cy="96" r="42" fill="#FDE047" fill-opacity="0.24"/>
  <circle cx="805" cy="96" r="30" fill="#F59E0B" stroke="#FEF08A" stroke-width="2.5"/>
  <circle cx="805" cy="96" r="19" fill="#FDE047" fill-opacity="0.7"/>

  <!-- Ground Base -->
  <rect x="0" y="422" width="960" height="118" fill="#071930"/>
  <line x1="48" y1="422" x2="912" y2="422" stroke="#2DD4BF" stroke-opacity="0.6" stroke-width="2.2"/>

  <!-- Left Info Card: Low-Carbon & Circular Materials -->
  <g transform="translate(62,126)">
    <rect x="0" y="0" width="215" height="260" rx="22" fill="#0E2C52" stroke="#2DD4BF" stroke-width="2.2"/>
    <text x="107" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#5EEAD4">GREEN MATERIALS</text>
    <!-- Stacked Layered Wall / Envelope Cross-Section -->
    <rect x="30" y="56" width="155" height="36" rx="8" fill="#92400E" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="107" y="79" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="800" fill="#FEF3C7">CLT MASS TIMBER</text>
    <rect x="30" y="102" width="155" height="36" rx="8" fill="#0F766E" stroke="#5EEAD4" stroke-width="1.8"/>
    <text x="107" y="125" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="800" fill="#CCFBF1">BIO-INSULATION</text>
    <rect x="30" y="148" width="155" height="36" rx="8" fill="#1E3A5F" stroke="#7DD3FC" stroke-width="1.8"/>
    <text x="107" y="171" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="800" fill="#E0F2FE">LOW-CO₂ CONCRETE</text>
    <text x="107" y="216" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#CBD5E1">Low Embodied Carbon</text>
    <text x="107" y="236" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#94A3B8">Circular &amp; Recyclable</text>
  </g>

  <!-- Centerpiece: Contemporary Sustainable Timber-and-Glass Green Building with Green Roof & BIPV -->
  <g transform="translate(318,98)">
    <!-- BIPV Solar Canopy Overhang -->
    <polygon points="10,48 318,18 326,34 16,64" fill="#0284C7" stroke="#7DD3FC" stroke-width="2.2"/>
    <line x1="78" y1="42" x2="78" y2="66" stroke="#94A3B8" stroke-width="3.5"/>
    <line x1="252" y1="26" x2="252" y2="66" stroke="#94A3B8" stroke-width="3.5"/>

    <!-- Green Living Roof Foliage -->
    <path d="M36 78 Q58 54 84 74 Q112 48 144 74 Q172 52 204 74 Q236 50 264 74 Q282 58 298 78 Z" fill="#0F766E" stroke="#2DD4BF" stroke-width="2"/>

    <!-- Main Architectural Structure (Timber Frame + Low-E Glazing) -->
    <rect x="28" y="78" width="276" height="246" rx="8" fill="#0E2C52" stroke="#F59E0B" stroke-width="2.8"/>
    <!-- Timber Floor Slabs -->
    <line x1="28" y1="160" x2="304" y2="160" stroke="#F59E0B" stroke-width="4.5"/>
    <line x1="28" y1="242" x2="304" y2="242" stroke="#F59E0B" stroke-width="4.5"/>
    <!-- Timber Columns -->
    <line x1="120" y1="78" x2="120" y2="324" stroke="#D97706" stroke-width="3.2"/>
    <line x1="212" y1="78" x2="212" y2="324" stroke="#D97706" stroke-width="3.2"/>

    <!-- Triple-Glazed Facade Windows & Green Balcony Accents -->
    <rect x="42" y="92" width="64" height="54" rx="4" fill="#38BDF8" fill-opacity="0.28" stroke="#7DD3FC" stroke-width="1.4"/>
    <rect x="134" y="92" width="64" height="54" rx="4" fill="#38BDF8" fill-opacity="0.28" stroke="#7DD3FC" stroke-width="1.4"/>
    <rect x="226" y="92" width="64" height="54" rx="4" fill="#FDE047" fill-opacity="0.28" stroke="#FDE68A" stroke-width="1.4"/>

    <rect x="42" y="174" width="64" height="54" rx="4" fill="#FDE047" fill-opacity="0.24" stroke="#FDE68A" stroke-width="1.4"/>
    <rect x="134" y="174" width="64" height="54" rx="4" fill="#2DD4BF" fill-opacity="0.26" stroke="#5EEAD4" stroke-width="1.4"/>
    <rect x="226" y="174" width="64" height="54" rx="4" fill="#38BDF8" fill-opacity="0.28" stroke="#7DD3FC" stroke-width="1.4"/>

    <!-- Ground Floor Atrium & Entrance -->
    <rect x="42" y="256" width="64" height="68" rx="4" fill="#38BDF8" fill-opacity="0.22" stroke="#7DD3FC" stroke-width="1.4"/>
    <rect x="134" y="258" width="64" height="66" rx="4" fill="#071930" stroke="#2DD4BF" stroke-width="1.8"/>
    <text x="166" y="295" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="800" fill="#5EEAD4">nZEB</text>
    <rect x="226" y="256" width="64" height="68" rx="4" fill="#38BDF8" fill-opacity="0.22" stroke="#7DD3FC" stroke-width="1.4"/>

    <!-- Vertical Greenery Accent -->
    <circle cx="28" cy="155" r="10" fill="#14B8A6"/>
    <circle cx="28" cy="238" r="10" fill="#14B8A6"/>
    <circle cx="304" cy="155" r="10" fill="#14B8A6"/>
    <circle cx="304" cy="238" r="10" fill="#14B8A6"/>
  </g>

  <!-- Right Info Card: Envelope Performance & Certification -->
  <g transform="translate(683,146)">
    <rect x="0" y="0" width="215" height="240" rx="22" fill="#0E2C52" stroke="#F59E0B" stroke-width="2.2"/>
    <text x="107" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#FEF3C7">BUILDING LIFECYCLE</text>
    <!-- Circular Sustainability Ring -->
    <circle cx="107" cy="118" r="52" fill="#071930" stroke="#2DD4BF" stroke-width="4" stroke-dasharray="28 10"/>
    <text x="107" y="114" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">A+</text>
    <text x="107" y="134" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#5EEAD4">NET-ZERO</text>
    <text x="107" y="198" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#CBD5E1">EPBD • LEED • DGNB</text>
    <text x="107" y="218" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#94A3B8">Deep Energy Retrofit</text>
  </g>

  <!-- Connector Lines -->
  <path d="M277 256 L346 256" stroke="#2DD4BF" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M622 256 L683 256" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Bottom Feature Pills -->
  <g transform="translate(82,468)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#2DD4BF" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#2DD4BF"/>
    <text x="116" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">LOW-CARBON MATERIALS</text>
  </g>
  <g transform="translate(370,468)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#F59E0B" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#F59E0B"/>
    <text x="116" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">GREEN ENVELOPES &amp; BIPV</text>
  </g>
  <g transform="translate(658,468)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#38BDF8"/>
    <text x="116" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">CIRCULAR RENOVATION</text>
  </g>

  <!-- Corner Badge -->
  <g transform="translate(32,26)">
    <rect x="0" y="0" width="38" height="30" rx="15" fill="#F59E0B" fill-opacity="0.22" stroke="#FDE68A" stroke-opacity="0.75" stroke-width="1.4"/>
    <polygon points="19,8 26,15 19,22 12,15" fill="#FDE047"/>
  </g>
</svg>
