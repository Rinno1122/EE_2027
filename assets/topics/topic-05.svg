<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Topic 05: Thermodynamics">

  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071930"/>
      <stop offset="55%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#133763"/>
    </linearGradient>
    <pattern id="gridPat" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93C5FD" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="#0B2545"/>
  <rect width="960" height="540" fill="url(#bgSky)"/>
  <rect width="960" height="540" fill="url(#gridPat)"/>

  <!-- Left: T-s Thermodynamic Cycle & Pinch / Exergy Chart -->
  <g transform="translate(72,92)">
    <rect x="0" y="0" width="390" height="320" rx="22" fill="#0E2C52" stroke="#F59E0B" stroke-opacity="0.8" stroke-width="2.2"/>
    <text x="195" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="800" fill="#FEF3C7">THERMODYNAMIC CYCLES (T–s)</text>
    <!-- Axes -->
    <line x1="56" y1="268" x2="352" y2="268" stroke="#94A3B8" stroke-width="2"/>
    <line x1="56" y1="268" x2="56" y2="62" stroke="#94A3B8" stroke-width="2"/>
    <text x="346" y="290" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#CBD5E1">Entropy s</text>
    <text x="44" y="72" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#CBD5E1">T</text>
    <!-- Saturation Dome -->
    <path d="M92 252 Q200 72 308 252" fill="none" stroke="#93C5FD" stroke-opacity="0.55" stroke-width="2.4" stroke-dasharray="6 4"/>
    <!-- Rankine / Power Cycle Loop -->
    <path d="M126 226 L126 168 L175 128 L272 128 L314 96 L314 226 Z" fill="#F59E0B" fill-opacity="0.18" stroke="#F97316" stroke-width="4" stroke-linejoin="round"/>
    <!-- State Points -->
    <circle cx="126" cy="226" r="5.5" fill="#38BDF8"/>
    <circle cx="126" cy="168" r="5.5" fill="#2DD4BF"/>
    <circle cx="314" cy="96" r="6" fill="#FDE047"/>
    <circle cx="314" cy="226" r="5.5" fill="#F97316"/>
    <text x="218" y="188" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#FEF08A">η &amp; Exergy</text>
    <text x="218" y="206" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#CBD5E1">ΔH = Q − W</text>
  </g>

  <!-- Right: Turbomachinery & Heat Transfer Exchanger -->
  <g transform="translate(498,92)">
    <rect x="0" y="0" width="390" height="320" rx="22" fill="#0E2C52" stroke="#2DD4BF" stroke-opacity="0.8" stroke-width="2.2"/>
    <text x="195" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="800" fill="#CCFBF1">TURBOMACHINERY &amp; HEAT TRANSFER</text>
    <!-- Steam/Gas Turbine Expansion Stage -->
    <polygon points="75,92 315,68 315,172 75,148" fill="#071930" stroke="#F59E0B" stroke-width="2.4"/>
    <line x1="120" y1="88" x2="120" y2="152" stroke="#FDE047" stroke-width="3.2"/>
    <line x1="168" y1="83" x2="168" y2="157" stroke="#F59E0B" stroke-width="3.2"/>
    <line x1="216" y1="78" x2="216" y2="162" stroke="#2DD4BF" stroke-width="3.2"/>
    <line x1="264" y1="73" x2="264" y2="167" stroke="#38BDF8" stroke-width="3.2"/>
    <line x1="48" y1="120" x2="342" y2="120" stroke="#94A3B8" stroke-width="4" stroke-dasharray="8 4"/>
    <!-- Microchannel / Fin-and-Tube Heat Exchanger Block -->
    <rect x="62" y="206" width="266" height="78" rx="14" fill="#071930" stroke="#38BDF8" stroke-width="2"/>
    <line x1="82" y1="226" x2="308" y2="226" stroke="#F97316" stroke-width="4"/>
    <line x1="82" y1="245" x2="308" y2="245" stroke="#F59E0B" stroke-width="4"/>
    <line x1="82" y1="264" x2="308" y2="264" stroke="#2DD4BF" stroke-width="4"/>
    <text x="195" y="198" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#7DD3FC">Heat Exchangers &amp; Pinch Integration</text>
  </g>

  <g transform="translate(85,466)">
    <rect x="0" y="0" width="215" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#F59E0B" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#F59E0B"/>
    <text x="113.5" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">EXERGY &amp; POWER CYCLES</text>
  </g>
  <g transform="translate(372,466)">
    <rect x="0" y="0" width="215" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#2DD4BF" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#2DD4BF"/>
    <text x="113.5" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">HEAT &amp; MASS TRANSFER</text>
  </g>
  <g transform="translate(660,466)">
    <rect x="0" y="0" width="215" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#38BDF8"/>
    <text x="113.5" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">TURBINES &amp; PINCH</text>
  </g>
  <g transform="translate(32,26)">
    <rect x="0" y="0" width="38" height="30" rx="15" fill="#F59E0B" fill-opacity="0.22" stroke="#FDE68A" stroke-opacity="0.75" stroke-width="1.4"/>
    <polygon points="19,8 26,15 19,22 12,15" fill="#FDE047"/>
  </g>
</svg>
