<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Topic 08: Cooling &amp; Refrigeration">

  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071930"/>
      <stop offset="55%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#133763"/>
    </linearGradient>
    <pattern id="gridPat" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93C5FD" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="#0B2545"/>
  <rect width="960" height="540" fill="url(#bgSky)"/>
  <rect width="960" height="540" fill="url(#gridPat)"/>

  <circle cx="480" cy="245" r="185" fill="#38BDF8" fill-opacity="0.09"/>
  <!-- Left: Cooling Load / Cold Chain / District Cooling -->
  <g transform="translate(76,125)">
    <rect x="0" y="0" width="215" height="245" rx="22" fill="#0E2C52" stroke="#38BDF8" stroke-width="2.2"/>
    <text x="107" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#7DD3FC">COLD CHAIN &amp; CHILLERS</text>
    <!-- Evaporator Cooling Coils -->
    <path d="M46 74 H168 C180 74 180 100 168 100 H46 C34 100 34 126 46 126 H168 C180 126 180 152 168 152 H46" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <path d="M46 74 H168 C180 74 180 100 168 100 H46 C34 100 34 126 46 126 H168 C180 126 180 152 168 152 H46" fill="none" stroke="#E0F2FE" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 8"/>
    <rect x="38" y="176" width="138" height="36" rx="10" fill="#071930" stroke="#2DD4BF" stroke-width="1.6"/>
    <text x="107" y="199" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#5EEAD4">−25 °C to +7 °C</text>
  </g>

  <!-- Center: Crisp Geometric Snowflake / Low-GWP Refrigeration Emblem -->
  <g transform="translate(480,248)">
    <circle r="110" fill="#071930" stroke="#38BDF8" stroke-width="3.2"/>
    <circle r="94" fill="none" stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="1.8" stroke-dasharray="8 6"/>
    <!-- 6-Pointed Technical Snowflake -->
    <g stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round">
      <line x1="0" y1="-64" x2="0" y2="64"/>
      <line x1="-55" y1="-32" x2="55" y2="32"/>
      <line x1="-55" y1="32" x2="55" y2="-32"/>
      <polyline points="-12,-50 0,-38 12,-50" fill="none"/>
      <polyline points="-12,50 0,38 12,50" fill="none"/>
      <polyline points="-48,-16 -33,-19 -36,-34" fill="none"/>
      <polyline points="48,16 33,19 36,34" fill="none"/>
      <polyline points="48,-16 33,-19 36,-34" fill="none"/>
      <polyline points="-48,16 -33,19 -36,34" fill="none"/>
    </g>
    <circle r="20" fill="#0E2C52" stroke="#FEF08A" stroke-width="2.2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#FEF08A">COP</text>
  </g>

  <!-- Right: Natural & Low-GWP Refrigerants (CO2, NH3, HFO, Solar Absorption) -->
  <g transform="translate(668,125)">
    <rect x="0" y="0" width="215" height="245" rx="22" fill="#0E2C52" stroke="#2DD4BF" stroke-width="2.2"/>
    <text x="107" y="34" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#5EEAD4">NATURAL REFRIGERANTS</text>
    <rect x="30" y="58" width="155" height="36" rx="10" fill="#071930" stroke="#38BDF8" stroke-width="1.6"/>
    <text x="107" y="81" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#E0F2FE">R744 (CO₂) • GWP = 1</text>
    <rect x="30" y="106" width="155" height="36" rx="10" fill="#071930" stroke="#2DD4BF" stroke-width="1.6"/>
    <text x="107" y="129" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#CCFBF1">R717 (NH₃) • R290</text>
    <rect x="30" y="154" width="155" height="36" rx="10" fill="#071930" stroke="#F59E0B" stroke-width="1.6"/>
    <text x="107" y="177" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#FEF08A">Solar Absorption</text>
    <text x="107" y="220" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#CBD5E1">F-Gas Compliant Cooling</text>
  </g>

  <path d="M291 248 L368 248" stroke="#38BDF8" stroke-width="3.8" stroke-dasharray="8 5"/>
  <path d="M592 248 L668 248" stroke="#2DD4BF" stroke-width="3.8" stroke-dasharray="8 5"/>

  <g transform="translate(85,474)">
    <rect x="0" y="0" width="215" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#38BDF8"/>
    <text x="113.5" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">CHILLERS &amp; ABSORPTION</text>
  </g>
  <g transform="translate(372,474)">
    <rect x="0" y="0" width="215" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#2DD4BF" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#2DD4BF"/>
    <text x="113.5" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">LOW-GWP REFRIGERANTS</text>
  </g>
  <g transform="translate(660,474)">
    <rect x="0" y="0" width="215" height="32" rx="16" fill="#071930" fill-opacity="0.88" stroke="#F59E0B" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="15" cy="16" r="4" fill="#F59E0B"/>
    <text x="113.5" y="20.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">COLD CHAIN &amp; COOLING</text>
  </g>
  <g transform="translate(32,26)">
    <rect x="0" y="0" width="38" height="30" rx="15" fill="#F59E0B" fill-opacity="0.22" stroke="#FDE68A" stroke-opacity="0.75" stroke-width="1.4"/>
    <polygon points="19,8 26,15 19,22 12,15" fill="#FDE047"/>
  </g>
</svg>
